apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-board-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notice-board
  template:
    metadata:
      labels:
        app: notice-board
    spec:
      containers:
      - name: notice-board-container
        image: Rishikaa3639/notice-board:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: notice-board-service
spec:
  type: NodePort
  selector:
    app: notice-board
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007
